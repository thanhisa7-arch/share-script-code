<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apex GT</title>
<!-- Font Fredoka giống phong cách hoạt hình -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-base: #7eb0d5;
  --surface: #fcf8eb;
  --surface-2: #e8dfc8;
  --surface-hover: #ffffff;
  --border-color: #3b3b3b;
  --text-main: #2b2b2b;
  --text-sub: #555555;
  --text-dim: #888888;
  --accent-yellow: #ffca3a;
  --accent-green: #5cb85c;
  --radius: 12px;
  --shadow-hard: 4px 4px 0px rgba(0,0,0,0.15);
  --shadow-btn: 0 4px 0px var(--border-color);
}

* { box-sizing: border-box; }
html { color-scheme: light; }
body {
  margin: 0;
  background-color: var(--bg-base);
  background-image: 
    linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
  background-size: 40px 40px;
  color: var(--text-main);
  font-family: 'Fredoka', system-ui, sans-serif;
  min-height: 100vh;
  padding-bottom: 40px;
  -webkit-font-smoothing: antialiased;
}

.header-container {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px 20px 10px 20px;
  max-width: 460px;
  margin: 0 auto;
}

/* ===== Ảnh ủng hộ ad (góc trên bên phải, kế avatar) ===== */
.support-badge {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 108px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  z-index: 20;
  animation: badgeFloat 2.8s ease-in-out infinite;
}

@keyframes badgeFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

.support-badge img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  display: block;
  border-radius: 12px;
  border: 3px solid var(--border-color);
  box-shadow: var(--shadow-hard);
  background: #fff;
}

.support-badge .support-text {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  line-height: 1.25;
  text-align: center;
  color: #ffffff;
  background: #e63946;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  padding: 3px 6px;
  box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
  text-shadow: 1px 1px 0 rgba(0,0,0,0.35);
}

.avatar-wrapper {
  position: relative;
  width: 100px;
  height: 100px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fff;
  border: 4px solid var(--border-color);
  box-shadow: var(--shadow-hard);
  padding: 2px;
  margin-bottom: 12px;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.avatar-wrapper.playing { animation: musicPulse 1.2s infinite alternate ease-in-out; }

@keyframes musicPulse {
  0% { transform: scale(1); box-shadow: var(--shadow-hard); }
  100% { transform: scale(1.05); box-shadow: 0 6px 0px rgba(0,0,0,0.2); border-color: var(--accent-yellow); }
}

.avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

.profile-name {
  font-size: 28px;
  font-weight: 700;
  color: var(--accent-yellow);
  text-shadow: 2px 2px 0 #333, -1px -1px 0 #333, 1px -1px 0 #333, -1px 1px 0 #333, 1px 1px 0 #333;
  margin-bottom: 16px;
  letter-spacing: 1px;
}

.audio-player-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #333;
  border: 3px solid var(--border-color);
  border-radius: 30px;
  padding: 8px 18px;
  width: 100%;
  max-width: 320px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-hard);
  cursor: pointer;
  user-select: none;
  transition: transform 0.1s;
}
.audio-player-card:active { transform: translateY(4px); box-shadow: none; }

.play-icon-badge {
  background: var(--accent-green);
  border: 2px solid var(--border-color);
  width: 34px;
  height: 34px;
  border-radius: 50%;
  color: white;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 0 var(--border-color);
}

.audio-info { display: flex; flex-direction: column; flex: 1; margin: 0 12px; }
.audio-title { font-size: 13px; font-weight: 600; color: #ffffff; }
.audio-sub { font-size: 11px; color: #aaaaaa; font-weight: 500; }

.equalizer { display: flex; align-items: flex-end; gap: 3px; height: 18px; }
.eq-bar { width: 4px; background: var(--accent-green); border-radius: 2px; height: 4px; }
.playing .eq-bar { animation: wave 0.8s infinite ease-in-out alternate; }
.playing .eq-bar:nth-child(1) { animation-delay: 0.1s; }
.playing .eq-bar:nth-child(2) { animation-delay: 0.3s; }
.playing .eq-bar:nth-child(3) { animation-delay: 0.2s; }
.playing .eq-bar:nth-child(4) { animation-delay: 0.4s; }

@keyframes wave { 0% { height: 4px; } 100% { height: 18px; } }

.social-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  width: 100%;
  max-width: 320px;
  margin-bottom: 25px;
}

.yt-btn, .tt-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  color: #ffffff;
  text-decoration: none;
  font-weight: 600;
  font-size: 13px;
  padding: 10px 12px;
  border-radius: var(--radius);
  width: 100%;
  min-width: 0;
  letter-spacing: 0.5px;
  border: 3px solid var(--border-color);
  box-shadow: var(--shadow-btn);
  transition: transform 0.1s, box-shadow 0.1s;
}

.yt-btn { background: #ff0000; }
.tt-btn { background: #000000; }

.yt-btn:active, .tt-btn:active { transform: translateY(4px); box-shadow: none; }

main { max-width: 800px; margin: 0 auto; padding: 10px 16px; }

.hero-title {
  text-align: center;
  font-size: clamp(24px, 6vw, 36px);
  font-weight: 700;
  margin: 4px 0;
  color: #ffffff;
  text-shadow: 2px 2px 0 var(--border-color), -1px -1px 0 var(--border-color), 1px -1px 0 var(--border-color), -1px 1px 0 var(--border-color), 1px 1px 0 var(--border-color);
}

.hero-sub {
  text-align: center;
  color: #ffffff;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.5px;
  margin-bottom: 24px;
  text-shadow: 1px 1px 0 var(--border-color);
}

/* ===== Search wrap + Suggestions ===== */
.search-wrap { position: relative; margin-bottom: 20px; }

.search-box {
  background: var(--surface);
  border: 3px solid var(--border-color);
  border-radius: 30px;
  padding: 6px 6px 6px 18px;
  display: flex;
  align-items: center;
  box-shadow: var(--shadow-hard);
  margin-bottom: 0;
}
.search-box input { border: none; outline: none; width: 100%; font-family: inherit; font-size: 15px; color: var(--text-main); background: transparent; font-weight: 500; }
.search-box input::placeholder { color: var(--text-dim); }
.search-box button {
  background: var(--accent-yellow); border: 2px solid var(--border-color); color: var(--text-main);
  padding: 8px 20px; border-radius: 20px; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer;
  box-shadow: 0 3px 0 var(--border-color); transition: transform .1s, box-shadow .1s;
}
.search-box button:active { transform: translateY(3px); box-shadow: none; }

.suggestions {
  position: absolute;
  top: calc(100% + 6px);
  left: 0; right: 0;
  background: var(--surface);
  border: 3px solid var(--border-color);
  border-radius: 16px;
  box-shadow: var(--shadow-hard);
  max-height: 300px;
  overflow-y: auto;
  z-index: 100;
  display: none;
  padding: 6px;
}
.suggestions.show { display: block; }
.suggestions .sug-item {
  padding: 10px 14px;
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-main);
  transition: background .15s;
}
.suggestions .sug-item:hover,
.suggestions .sug-item.active { background: var(--accent-yellow); }

/* Ẩn nhãn GAME / HUB */
.suggestions .sug-type { display: none !important; }

.suggestions .sug-empty {
  padding: 12px;
  text-align: center;
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 600;
}

.tags {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 20px;
}

.tags button {
  width: 100%; min-width: 0; background: var(--surface); border: 3px solid var(--border-color);
  padding: 8px 6px; border-radius: 20px; font-family: inherit; font-size: 13px; font-weight: 700;
  color: var(--text-main); cursor: pointer; display: flex; align-items: center; justify-content: center;
  gap: 6px; line-height: 1.2; text-align: center; white-space: normal; word-break: break-word; overflow: hidden;
  box-shadow: 0 3px 0 var(--border-color); transition: transform .1s, box-shadow .1s, background .2s;
}
.tags button:active { transform: translateY(3px); box-shadow: none; }
.tags button.on { background: var(--accent-yellow); color: var(--text-main); }
.tags button span.dot { flex: 0 0 auto; width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 2px solid var(--border-color); }

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.card {
  background: var(--surface);
  border: 3px solid var(--border-color);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-hard);
  display: flex;
  flex-direction: column;
  transition: transform .1s, box-shadow .1s;
}
.card:active { transform: translateY(4px); box-shadow: none; }

.card-img-box {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #e0e0e0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  border-bottom: 3px solid var(--border-color);
}

.card-img-box::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, #d0d0d0 25%, #e8e8e8 50%, #d0d0d0 75%);
  background-size: 200% 100%; animation: shimmer 1.4s infinite; z-index: 1; transition: opacity .35s ease;
}
.card-img-box.loaded::before { opacity: 0; pointer-events: none; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

.card-img-box img {
  width: 100%; height: 100%; object-fit: cover; 
  object-position: top center;
  opacity: 0; transition: opacity .35s ease; position: relative; z-index: 2;
}
.card-img-box img.img-ready { opacity: 1; }

.card-img-placeholder {
  color: var(--text-main); font-weight: 700; font-size: 14px; letter-spacing: 0.5px;
  text-align: center; padding: 0 8px; position: relative; z-index: 2;
}

.card-body { padding: 12px; display: flex; flex-direction: column; flex: 1; }

.card-title {
  font-size: 20px; 
  font-weight: 700; 
  margin: 0 0 12px 0; 
  color: var(--text-main); 
  line-height: 1.3;
  text-align: center;
}

.game-name { 
  color: #e63946; 
  font-weight: 600; 
  display: block; 
  margin-top: 6px; 
  font-size: 16px; 
}

.card-footer {
  margin-top: auto; display: flex; justify-content: space-between; align-items: center;
  gap: 6px; padding-top: 10px; border-top: 2px dashed rgba(0,0,0,0.1);
}

.btn-link {
  flex: 1; text-align: center; background: #ffffff; border: 2px solid var(--border-color);
  color: var(--text-main); text-decoration: none; font-weight: 700; font-size: 13px; padding: 8px 0;
  border-radius: 8px; transition: all .1s ease; display: flex; justify-content: center; align-items: center;
  box-shadow: 0 3px 0 var(--border-color);
}
.btn-link:active { transform: translateY(3px); box-shadow: none; background: #f0f0f0; }

.btn-sub { background: #f4f4f4; }

.pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 30px; flex-wrap: wrap; }
.pagination button {
  background: #ffffff; border: 2px solid var(--border-color); padding: 8px 16px; border-radius: 10px;
  font-family: inherit; font-size: 14px; font-weight: 700; color: var(--text-main); cursor: pointer;
  box-shadow: 0 3px 0 var(--border-color); transition: all 0.1s ease;
}
.pagination button:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
.pagination button.active { background: var(--accent-yellow); }
.pagination button:disabled { opacity: 0.5; cursor: not-allowed; background: #ddd; }

@media (max-width: 480px) {
  .tags { grid-template-columns: repeat(2, 1fr); }
  .grid { gap: 8px; }
  .card-body { padding: 10px 6px; }
  .card-title { font-size: 16px; } 
  .game-name { font-size: 14px; margin-top: 4px; }
  .btn-link { font-size: 11px; padding: 6px 0; }

  /* Badge nhỏ lại cho gọn trên điện thoại */
  .support-badge { width: 78px; top: 8px; right: 8px; gap: 4px; }
  .support-badge .support-text { font-size: 9px; padding: 2px 4px; border-radius: 6px; }
}
.avatar-ph { display:flex; align-items:center; justify-content:center; background:var(--accent-yellow); font-size:44px; font-weight:700; color:var(--text-main); }
.empty-state { grid-column: 1 / -1; text-align:center; background:var(--surface); border:3px solid var(--border-color); border-radius:var(--radius); box-shadow:var(--shadow-hard); padding:28px 16px; font-weight:600; color:var(--text-sub); }
.avatar-wrapper { border-radius: 26px; padding: 0; overflow: hidden; background: transparent; }
.avatar-img { border-radius: 0; object-fit: contain; }
.header-container { padding-top: calc(56px + env(safe-area-inset-top, 0px)); }
.island { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 50%; transform: translateX(-50%); z-index: 200;
  width: 126px; height: 36px; background: #000; color: #fff; border-radius: 20px; overflow: hidden; cursor: pointer; -webkit-tap-highlight-color: transparent;
  box-shadow: 0 4px 0 rgba(0,0,0,.25); transition: width .5s cubic-bezier(.3,1.35,.5,1), height .5s cubic-bezier(.3,1.35,.5,1), border-radius .5s; }
.island:active { transform: translateX(-50%) scale(.95); }
.island.show { width: min(250px, calc(100vw - 150px)); height: 46px; border-radius: 26px; }
.island-bar { height: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 14px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.island-dot { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }
.island-text { overflow: hidden; text-overflow: ellipsis; transition: opacity .2s; }
.island-text.swap { opacity: 0; }

.lang-btn { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); right: 12px; z-index: 210; height: 36px; padding: 0 12px;
  display: inline-flex; align-items: center; gap: 6px; font-family: inherit; font-size: 13px; font-weight: 700; color: var(--text-main);
  background: var(--surface); border: 3px solid var(--border-color); border-radius: 18px; box-shadow: 0 3px 0 var(--border-color); cursor: pointer; transition: transform .1s, box-shadow .1s; }
.lang-btn:active { transform: translateY(3px); box-shadow: none; }
.lang-menu { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 54px); right: 12px; z-index: 210; min-width: 150px; display: none; flex-direction: column; gap: 4px; padding: 6px;
  background: var(--surface); border: 3px solid var(--border-color); border-radius: 16px; box-shadow: var(--shadow-hard); }
.lang-menu.show { display: flex; }
.lang-menu button { font-family: inherit; font-size: 14px; font-weight: 600; text-align: left; padding: 9px 12px; border: none; border-radius: 10px; background: transparent; color: var(--text-main); cursor: pointer; }
.lang-menu button:hover { background: #fff; }
.lang-menu button.on { background: var(--accent-yellow); font-weight: 700; }
body.in-view .header-container, body.in-view main { display: none; }
.view-page { display: none; max-width: 520px; margin: 0 auto; padding: calc(62px + env(safe-area-inset-top, 0px)) 16px 40px; }
body.in-view .view-page { display: block; }
.back-btn { display: inline-flex; align-items: center; gap: 6px; font-family: inherit; font-weight: 700; font-size: 14px; padding: 8px 16px; margin-bottom: 14px; background: var(--surface); border: 3px solid var(--border-color); border-radius: 20px; box-shadow: 0 3px 0 var(--border-color); cursor: pointer; color: var(--text-main); }
.back-btn:active { transform: translateY(3px); box-shadow: none; }
.view-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.view-tabs button { font-family: inherit; font-weight: 700; font-size: 13px; padding: 10px 6px; background: #fff; border: 3px solid var(--border-color); border-radius: 14px; box-shadow: 0 3px 0 var(--border-color); cursor: pointer; color: var(--text-main); }
.view-tabs button.on { background: var(--accent-yellow); }
.view-tabs button:active { transform: translateY(3px); box-shadow: none; }
.view-card { background: var(--surface); border: 3px solid var(--border-color); border-radius: 16px; box-shadow: var(--shadow-hard); overflow: hidden; }
.view-img { width: 100%; aspect-ratio: 16 / 9; background: #e0e0e0; border-bottom: 3px solid var(--border-color); display: flex; align-items: center; justify-content: center; font-weight: 700; letter-spacing: .5px; overflow: hidden; }
.view-img img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
.view-inner { padding: 20px 16px 24px; text-align: center; }
.view-badge { display: inline-block; background: var(--accent-yellow); border: 2px solid var(--border-color); border-radius: 20px; padding: 3px 14px; font-weight: 700; font-size: 13px; box-shadow: 0 3px 0 var(--border-color); }
.view-title { font-size: 26px; font-weight: 700; margin: 14px 0 4px; }
.view-game { color: #e63946; font-weight: 600; margin-bottom: 12px; min-height: 1em; }
.view-body { color: var(--text-sub); font-size: 15px; font-weight: 500; line-height: 1.55; }
.view-steps { text-align: left; margin: 18px 0 0; padding: 14px 16px 14px 34px; background: #fff; border: 2px dashed rgba(0,0,0,.25); border-radius: 12px; color: var(--text-main); font-size: 14px; font-weight: 500; line-height: 1.6; }
.view-steps li + li { margin-top: 4px; }
.view-steps-title { text-align: left; font-weight: 700; margin-top: 18px; font-size: 14px; }
.view-hint { margin-top: 10px; font-size: 13px; color: var(--text-dim); font-weight: 600; }
.view-actions { display: flex; gap: 10px; margin-top: 18px; }
button.btn-link { font-family: inherit; cursor: pointer; }
.btn-link.disabled { opacity: .5; pointer-events: none; }
body.in-upload .header-container, body.in-upload main { display: none; }
.upload-page { display: none; max-width: 520px; margin: 0 auto; padding: calc(62px + env(safe-area-inset-top, 0px)) 16px 40px; }
body.in-upload .upload-page { display: block; }
.up-btn { font-family: inherit; font-weight: 700; font-size: 14px; padding: 9px 22px; background: var(--accent-yellow); color: var(--text-main); border: 3px solid var(--border-color); border-radius: 22px; box-shadow: 0 3px 0 var(--border-color); cursor: pointer; }
.up-btn:active { transform: translateY(3px); box-shadow: none; }
.fld { margin-top: 14px; text-align: left; }
.fld label { display: block; font-weight: 700; font-size: 13px; margin-bottom: 5px; }
.fld input[type=text], .fld input[type=url], .fld select, .fld textarea { width: 100%; font-family: inherit; font-size: 15px; font-weight: 500; padding: 10px 12px; color: var(--text-main); background: #fff; border: 3px solid var(--border-color); border-radius: 12px; outline: none; }
.fld textarea { min-height: 80px; resize: vertical; }
.fld input[type=file] { font-family: inherit; font-size: 13px; width: 100%; }
.up-preview { display: none; width: 100%; max-height: 180px; object-fit: cover; margin-top: 8px; border: 3px solid var(--border-color); border-radius: 12px; }
.up-note { font-size: 13px; font-weight: 600; color: var(--text-dim); margin-top: 6px; text-align: left; }
.up-submit { width: 100%; margin-top: 20px; padding: 12px; font-size: 16px; }
body.in-admin .header-container, body.in-admin main { display: none; }
.admin-page { display: none; max-width: 520px; margin: 0 auto; padding: calc(62px + env(safe-area-inset-top, 0px)) 16px 40px; }
body.in-admin .admin-page { display: block; }
.adm-link { font-family: inherit; font-size: 12px; font-weight: 700; background: transparent; border: none; color: #fff; opacity: .85; cursor: pointer; text-shadow: 1px 1px 0 var(--border-color); }
.adm-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 2px dashed rgba(0,0,0,.15); text-align: left; }
.adm-name { flex: 1; min-width: 0; font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; }
.adm-name small { display: block; font-weight: 600; font-size: 11px; color: var(--text-dim); }
.btn-link.adm-btn { flex: none; padding: 6px 12px; font-size: 12px; }
.adm-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.adm-actions .btn-link { padding: 10px 0; }
</style>
</head>
<body>

<div class="island" id="island" role="status" aria-live="polite">
  <div class="island-bar"><span class="island-dot"></span><span class="island-text" id="islandText">Apex GT</span></div>

<script>
/* ============ Fast CDN rewrite + image resize ============ */
function fastCDN(url){
  if (!url) return url;

  const m = url.match(/^https:\/\/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/(.+)$/);
  if (m) {
    const [, user, repo, rest] = m;
    let branch, path;
    if (rest.startsWith('refs/heads/')) {
      const after = rest.slice(11);
      const s = after.indexOf('/');
      if (s !== -1) { branch = after.slice(0, s); path = after.slice(s + 1); }
    } else {
      const s = rest.indexOf('/');
      if (s !== -1) { branch = rest.slice(0, s); path = rest.slice(s + 1); }
    }
    if (branch && path) {
      return `https://cdn.jsdelivr.net/gh/${user}/${repo}@${branch}/${path}`;
    }
    return url;
  }

  if (/^https:\/\/i\.ibb\.co\//.test(url)) {
    return `https://wsrv.nl/?url=${encodeURIComponent(url)}&w=640&output=webp&q=75`;
  }

  return url;
}

function sha256(str) {
  const K = [], H = []; let n = 2, c = 0;
  while (c < 64) { let p = true; for (let i = 2; i * i <= n; i++) if (n % i === 0) { p = false; break; }
    if (p) { if (c < 8) H[c] = (Math.pow(n, .5) % 1 * 4294967296) | 0; K[c++] = (Math.pow(n, 1 / 3) % 1 * 4294967296) | 0; } n++; }
  const m = Array.from(new TextEncoder().encode(str)), bits = m.length * 8;
  m.push(0x80); while (m.length % 64 !== 56) m.push(0);
  m.push(0, 0, 0, 0, (bits >>> 24) & 255, (bits >>> 16) & 255, (bits >>> 8) & 255, bits & 255);
  const w = new Array(64); let h = H.slice();
  for (let o = 0; o < m.length; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = (m[o + 4 * i] << 24) | (m[o + 4 * i + 1] << 16) | (m[o + 4 * i + 2] << 8) | m[o + 4 * i + 3];
    for (let i = 16; i < 64; i++) { const x = w[i - 15], y = w[i - 2];
      w[i] = (w[i - 16] + (((x >>> 7) | (x << 25)) ^ ((x >>> 18) | (x << 14)) ^ (x >>> 3)) + w[i - 7] + (((y >>> 17) | (y << 15)) ^ ((y >>> 19) | (y << 13)) ^ (y >>> 10))) | 0; }
    let [a, b, c2, d, e, f, g, hh] = h;
    for (let i = 0; i < 64; i++) {
      const t1 = (hh + (((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7))) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10))) + ((a & b) ^ (a & c2) ^ (b & c2))) | 0;
      hh = g; g = f; f = e; e = (d + t1) | 0; d = c2; c2 = b; b = a; a = (t1 + t2) | 0;
    }
    h = [h[0] + a | 0, h[1] + b | 0, h[2] + c2 | 0, h[3] + d | 0, h[4] + e | 0, h[5] + f | 0, h[6] + g | 0, h[7] + hh | 0];
  }
  return h.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}

    return;
  }
  const rows = SCRIPTS.map(s => {
    const tag = s.mine ? t('tagMine') : t('tagBuilt');
    const hid = HIDDEN.has(s.id) ? ' · ' + t('tagHidden') : '';
    const btn = s.mine
      ? `<button class="btn-link adm-btn" type="button" data-act="del" data-id="${s.id}">${esc(t('del'))}</button>`
      : `<button class="btn-link btn-sub adm-btn" type="button" data-act="toggle" data-id="${s.id}">${esc(HIDDEN.has(s.id) ? t('show') : t('hide'))}</button>`;
    return `<div class="adm-row"><div class="adm-name">${esc(L(s, 'hub'))}<small>${esc(tag + hid)}</small></div>${btn}</div>`;
  }).join('');
  box.innerHTML = `<div class="view-title" style="margin-top:0">${esc(t('adminTitle'))}</div>
    <div class="up-note">${esc(t('allItems'))}: ${SCRIPTS.length}</div>
    <div>${rows}</div>
    <div class="adm-actions">
      <button class="btn-link btn-sub" type="button" data-act="export">${esc(t('exportJson'))}</button>
      <button class="btn-link btn-sub" type="button" data-act="clear">${esc(t('clearMine'))}</button>
    </div>
    <div class="fld"><label>${esc(t('newPw'))}</label><input id="admNew" type="password" autocomplete="new-password"></div>
    <div class="adm-actions"><button class="btn-link" type="button" data-act="chpw">${esc(t('changePw'))}</button>
      <button class="btn-link btn-sub" type="button" data-act="logout">${esc(t('logout'))}</button></div>
    <div class="up-note" style="margin-top:14px">${esc(t('admNote'))}</div>`;
}
function tryLogin() {
  const p = upEl('admPw'); if (!p) return;
  if (pwHash(p.value) === getHash()) { adminAuthed = true; notify(t('loggedIn')); renderAdmin(); }
  else { notify(t('wrongPw')); p.value = ''; p.focus(); }
}
upEl('admBtn').addEventListener('click', () => {
  if (!cur && !upOpen && !admOpen) homeScroll = window.scrollY;
  navCount++; location.hash = '#/admin';
});
upEl('admBack').addEventListener('click', goBack);
upEl('admBox').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'admPw') tryLogin(); });
upEl('admBox').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = +b.dataset.id;
  if (act === 'login') return tryLogin();
  if (!adminAuthed) return;
  if (act === 'del') { const i = SCRIPTS.findIndex(x => x.id === id && x.mine); if (i >= 0) { SCRIPTS.splice(i, 1); saveUser(); render(); renderAdmin(); notify(t('deleted')); } }
  else if (act === 'toggle') { HIDDEN.has(id) ? HIDDEN.delete(id) : HIDDEN.add(id); saveHidden(); render(); renderAdmin(); }
  else if (act === 'export') { try { await navigator.clipboard.writeText(JSON.stringify(SCRIPTS.filter(x => x.mine), null, 2)); notify(t('exported')); } catch (er) { notify(t('copyFail')); } }
  else if (act === 'clear') { if (confirm(t('clearAsk'))) { for (let i = SCRIPTS.length - 1; i >= 0; i--) if (SCRIPTS[i].mine) SCRIPTS.splice(i, 1); saveUser(); render(); renderAdmin(); notify(t('deleted')); } }
  else if (act === 'chpw') {
    const v = upEl('admNew').value;
    if (v.length < 6) { notify(t('pwShort')); return; }
    try { localStorage.setItem('adminHash', pwHash(v)); notify(t('pwChanged')); upEl('admNew').value = ''; } catch (er) { notify(t('saveFail')); }
  }
  else if (act === 'logout') { adminAuthed = false; notify(t('loggedOut')); renderAdmin(); }
});

/* ============ Fast image pipeline ============ */
let imgObserver;
if (typeof IntersectionObserver !== 'undefined') {
  imgObserver = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      const img = entry.target;
      const url = img.dataset.src;
      if (url && !img.src) {
        img.src = url;
        img.onload = () => {
          img.classList.add('img-ready');
          const box = img.closest('.card-img-box');
          if (box) box.classList.add('loaded');
        };
        img.onerror = () => {
          const box = img.closest('.card-img-box');
          if (box) box.classList.add('loaded');
        };
      }
      imgObserver.unobserve(img);
    }
  }, { rootMargin: '600px 0px', threshold: 0.01 });
} else {
  imgObserver = {
    observe: (img) => {
      const url = img.dataset.src;
      if (url && !img.src) {
        img.src = url;
        img.onload = () => {
          img.classList.add('img-ready');
          const box = img.closest('.card-img-box');
          if (box) box.classList.add('loaded');
        };
        img.onerror = () => {
          const box = img.closest('.card-img-box');
          if (box) box.classList.add('loaded');
        };
      }
    },
    unobserve: () => {}
  };
}

function primeFirstImages(count = 4) {
  const imgs = [...document.querySelectorAll('.card-img-box img[data-src]')].slice(0, count);
  imgs.forEach(img => {
    const url = img.dataset.src;
    if (!url) return;
    img.fetchPriority = 'high';
    img.removeAttribute('loading');
    img.src = url;
    img.onload = () => {
      img.classList.add('img-ready');
      const box = img.closest('.card-img-box');
      if (box) box.classList.add('loaded');
    };
    img.onerror = () => {
      const box = img.closest('.card-img-box');
      if (box) box.classList.add('loaded');
    };
    imgObserver.unobserve(img);
  });
}

/* ============ Render ============ */
function render(){
  const q = $('q').value.trim().toLowerCase();

  const filtered = SCRIPTS.filter(s =>
    visible(s) &&
    (cat === 'Tất Cả' || s.c === cat) &&
    (!q || matches(s, q))
  );

  const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE) || 1;
  if (currentPage > totalPages) currentPage = totalPages;

  const start = (currentPage - 1) * ITEMS_PER_PAGE;
  const paginated = filtered.slice(start, start + ITEMS_PER_PAGE);

  $('tags').innerHTML = cats.map((c, i) => `
    <button class="${c === cat ? 'on' : ''}" onclick="changeCat('${c}')">
      <span class="dot" style="background:${dotColors[i % dotColors.length]}"></span>
      <span>${catLabel(c)}</span>
    </button>
  `).join('');

  if (!paginated.length) {
    $('list').innerHTML = '<div class="empty-state">' + t('sub') + '</div>';
  } else $('list').innerHTML = paginated.map(s => `
    <div class="card">
      <div class="card-img-box">
        ${s.img
          ? `<img data-src="${fastCDN(s.img)}" alt="${esc(L(s,'hub'))}" decoding="async" loading="lazy" fetchpriority="low" width="640" height="360">`
          : `<div class="card-img-placeholder">APEX GT</div>`}
      </div>
      <div class="card-body">
        <h2 class="card-title">
          ${esc(L(s,'hub'))} ${L(s,'game') ? `<span class="game-name">${esc(L(s,'game'))}</span>` : ''}
        </h2>
        <div class="card-footer">
          <a class="btn-link" href="#" onclick="openView(${s.id},'main');return false">${t('link1')}</a>
          <a class="btn-link btn-sub" href="#" onclick="openView(${s.id},'sub');return false">${t('link2')}</a>
        </div>
      </div>
    </div>
  `).join('');

  document.querySelectorAll('.card-img-box img[data-src]').forEach(img => imgObserver.observe(img));
  primeFirstImages(4);

  let pageButtons = '';
  if (totalPages > 1) {
    pageButtons += `<button ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">&larr; ${t('prev')}</button>`;
    for (let p = 1; p <= totalPages; p++) {
      pageButtons += `<button class="${p === currentPage ? 'active' : ''}" onclick="changePage(${p})">${p}</button>`;
    }
    pageButtons += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">${t('next')} &rarr;</button>`;
  }
  $('pagination').innerHTML = pageButtons;
}

function changeCat(c) { cat = c; currentPage = 1; render(); hideSuggestions(); }
function changePage(p) { currentPage = p; render(); window.scrollTo({ top: 300, behavior: 'smooth' }); }

/* ============ Suggestions (autocomplete) ============ */
const inputEl = $('q');
const sugBox  = $('suggestions');
let sugItems = [];
let sugActiveIdx = -1;

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function hideSuggestions() {
  sugBox.classList.remove('show');
  sugBox.innerHTML = '';
  sugItems = [];
  sugActiveIdx = -1;
}

function showSuggestions(query) {
  const q = query.trim().toLowerCase();
  if (!q) { hideSuggestions(); return; }

  const gameSet = new Set();
  const hubSet  = new Set();
  SCRIPTS.filter(visible).forEach(s => {
    vals(s, 'game').forEach(v => { if (v.toLowerCase().includes(q)) gameSet.add(v); });
    vals(s, 'hub').forEach(v => { if (v.toLowerCase().includes(q)) hubSet.add(v); });
  });

  sugItems = [
    ...[...gameSet].slice(0, 6).map(v => ({ type: 'Game', label: v })),
    ...[...hubSet ].slice(0, 6).map(v => ({ type: 'Hub',  label: v })),
  ];
  sugActiveIdx = -1;

  if (!sugItems.length) {
    sugBox.innerHTML = `<div class="sug-empty">${t('nosug')}</div>`;
    sugBox.classList.add('show');
    return;
  }

  sugBox.innerHTML = sugItems.map((it, i) => `
    <div class="sug-item" data-idx="${i}">
      <span class="sug-label">${esc(it.label)}</span>
    </div>
  `).join('');
  sugBox.classList.add('show');

  sugBox.querySelectorAll('.sug-item').forEach(el => {
    el.addEventListener('click', () => pickSuggestion(Number(el.dataset.idx)));
  });
}

function pickSuggestion(idx) {
  const it = sugItems[idx];
  if (!it) return;
  inputEl.value = it.label;
  cat = 'Tất Cả';
  currentPage = 1;
  render();
  hideSuggestions();
  inputEl.blur();
}

function highlightSuggestion(newIdx) {
  const nodes = sugBox.querySelectorAll('.sug-item');
  if (!nodes.length) return;
  sugActiveIdx = (newIdx + nodes.length) % nodes.length;
  nodes.forEach((n, i) => n.classList.toggle('active', i === sugActiveIdx));
  nodes[sugActiveIdx].scrollIntoView({ block: 'nearest' });
}

let renderTimeout;
inputEl.addEventListener('input', () => {
  if (inputEl.value.trim() !== '') cat = 'Tất Cả';
  currentPage = 1;
  clearTimeout(renderTimeout);
  renderTimeout = setTimeout(render, 150);
  showSuggestions(inputEl.value);
});

inputEl.addEventListener('keydown', (e) => {
  if (!sugBox.classList.contains('show')) {
    if (e.key === 'Enter' && inputEl.value.trim() !== '') {
      cat = 'Tất Cả'; currentPage = 1; render();
    }
    return;
  }
  if (e.key === 'ArrowDown') { e.preventDefault(); highlightSuggestion(sugActiveIdx + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); highlightSuggestion(sugActiveIdx - 1); }
  else if (e.key === 'Enter') {
    e.preventDefault();
    if (sugActiveIdx >= 0) pickSuggestion(sugActiveIdx);
    else { if (inputEl.value.trim() !== '') { cat = 'Tất Cả'; currentPage = 1; render(); } hideSuggestions(); }
  } else if (e.key === 'Escape') {
    hideSuggestions();
  }
});

$('go').addEventListener('click', () => {
  if (inputEl.value.trim() !== '') cat = 'Tất Cả';
  currentPage = 1;
  render();
  hideSuggestions();
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrap')) hideSuggestions();
});

/* ============ Báo không thấy kết quả ============ */
let lastNoResult = '';
function checkNoResult(force) {
  const raw = inputEl.value.trim();
  const q = raw.toLowerCase();
  if (!q) { lastNoResult = ''; return; }
  const found = SCRIPTS.some(s => visible(s) && matches(s, q));
  if (found) { lastNoResult = ''; return; }
  if (!force && q === lastNoResult) return;
  lastNoResult = q;
  notify(t('noresult').replace('{q}', raw.length > 24 ? raw.slice(0, 24) + '…' : raw), 3200);
}
let noResTimer;
inputEl.addEventListener('input', () => { clearTimeout(noResTimer); noResTimer = setTimeout(() => checkNoResult(false), 700); });
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') setTimeout(() => checkNoResult(true), 0); });
$('go').addEventListener('click', () => checkNoResult(true));

setLang(lang);
handleRoute();
setTimeout(() => notify(t('welcome')), 700);
</script>
